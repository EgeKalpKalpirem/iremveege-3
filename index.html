<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ege & İrem - Sonsuza Kadar</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1a0826 0%, #3a0037 50%, #1a0022 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Stars/Glow Effect */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,105,180,0.2) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
            position: relative;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: #ff7ebb;
            text-shadow: 0 0 15px rgba(255, 126, 187, 0.6);
            margin-bottom: 25px;
        }

        .music-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .music-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffd1dc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
            outline: none;
        }

        .note-box {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #ff7ebb;
            padding: 25px 20px;
            border-radius: 8px;
            margin-bottom: 35px;
        }

        .note-text {
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: 300;
            color: #f1f1f1;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .love-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
            transition: all 0.3s ease;
            outline: none;
            user-select: none;
        }

        .love-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 65, 108, 0.6);
        }

        .love-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Floating elements animation */
        .floating-item {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 2rem;
            animation: floatUp 3s ease-out forwards;
            opacity: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            .note-text { font-size: 1.05rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <h1>Ege & İrem</h1>

        <div class="music-card">
            <div class="music-title">
                <span>🎵</span> pupsies - misery.
            </div>
            <audio controls autoplay loop>
                <source src="misery.mp3" type="audio/mpeg">
                Tarayıcınız ses öğesini desteklemiyor.
            </audio>
        </div>

        <div class="note-box">
            <p class="note-text">
                "Ege ve İrem sonsuza kadar aşık kalacak çünkü aşk basit bir yapı değil karmaşık ve sonsuz bir yapıdır."
            </p>
        </div>

        <button class="love-btn" onclick="createLoveExplosion(event)">
            Sevgimizi Göster ✨
        </button>
    </div>

    <script>
        function createLoveExplosion(event) {
            const items = ['💖', '💕', '💗', '💓', '🐰', '🐇', '✨', '❤️'];
            const count = 30;

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.classList.add('floating-item');
                    item.innerText = items[Math.floor(Math.random() * items.length)];

                    const x = Math.random() * window.innerWidth;
                    const startY = window.innerHeight + 20;

                    item.style.left = x + 'px';
                    item.style.top = startY + 'px';
                    
                    const size = Math.random() * 1.8 + 1.2;
                    item.style.fontSize = size + 'rem';
                    item.style.animationDuration = (Math.random() * 2 + 2) + 's';

                    document.body.appendChild(item);

                    setTimeout(() => {
                        item.remove();
                    }, 4000);
                }, i * 50);
            }
        }
    </script>
</body>
  </html>
